<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login — CHROMANEST</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background: #1A151C; color: #FAF7F2;">

  <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div style="width: 100%; max-width: 440px; background: #241D27; border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-lg); padding: 3rem 2.5rem; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
      
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 55px; height: 55px; background: rgba(142, 124, 147, 0.2); border: 1px solid var(--accent-lavender); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto; color: var(--accent-gold); font-size: 1.4rem;">
          <i class="fas fa-shield-alt"></i>
        </div>
        <h2 style="font-size: 1.8rem; margin-bottom: 0.3rem;">CHROMANEST</h2>
        <span style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-mauve);">Studio Admin Management</span>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div style="padding: 0.85rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem; font-size: 0.9rem; background: rgba(192, 57, 43, 0.2); color: #F5B7B1; border: 1px solid rgba(192, 57, 43, 0.4);">
              <i class="fas fa-exclamation-triangle" style="margin-right: 6px;"></i> {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="/admin/login" method="POST">
        <div class="form-group" style="margin-bottom: 1.3rem;">
          <label class="form-label" style="display: block; font-size: 0.88rem; color: #D1CCD4; margin-bottom: 6px;">Admin Email</label>
          <input type="email" name="email" value="admin@chromanest.com" required class="form-control" style="width: 100%; padding: 0.85rem 1rem; border: 1px solid rgba(255,255,255,0.15); border-radius: var(--radius-sm); background: #18131B; color: #FAF7F2;">
        </div>

        <div class="form-group" style="margin-bottom: 1.8rem;">
          <label class="form-label" style="display: block; font-size: 0.88rem; color: #D1CCD4; margin-bottom: 6px;">Password</label>
          <input type="password" name="password" value="admin123" required class="form-control" style="width: 100%; padding: 0.85rem 1rem; border: 1px solid rgba(255,255,255,0.15); border-radius: var(--radius-sm); background: #18131B; color: #FAF7F2;">
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; background: var(--accent-lavender-dark); border-color: var(--accent-lavender);">
          <i class="fas fa-sign-in-alt" style="margin-right: 6px;"></i> Authenticate Admin
        </button>
      </form>

      <div style="margin-top: 2rem; text-align: center;">
        <a href="/" style="color: var(--text-muted); font-size: 0.88rem; text-decoration: none;">
          <i class="fas fa-arrow-left" style="margin-right: 4px;"></i> Return to Storefront
        </a>
      </div>

    </div>
  </div>

</body>
</html>
