<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ 'Edit Artwork' if product else 'Add New Artwork' }} — CHROMANEST Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background: #F6F4F1;">

  <header style="background: #221B24; color: #FAF7F2; padding: 1rem 0;">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <a href="/admin" style="font-family: var(--font-serif); font-size: 1.6rem; font-weight: 700; color: #FAF7F2; text-decoration: none;">
        CHROMANEST ADMIN
      </a>
      <a href="/admin/products" class="btn btn-secondary btn-sm" style="background: rgba(255,255,255,0.1); color: #FAF7F2; border-color: rgba(255,255,255,0.2);">
        <i class="fas fa-arrow-left"></i> Back to Products
      </a>
    </div>
  </header>

  <main class="container section-padding" style="max-width: 800px; margin: 0 auto;">
    <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow-sm);">
      <h1 style="font-size: 2rem; font-family: var(--font-serif); font-weight: 600; margin-bottom: 0.5rem;">
        {{ 'Edit Artwork Details' if product else 'Add New Artwork to Store' }}
      </h1>
      <p style="color: var(--text-secondary); margin-bottom: 2rem;">Fill out the details below to update the storefront catalog in real-time.</p>

      <form action="{{ '/admin/products/edit/' + product['id'] if product else '/admin/products/add' }}" method="POST">
        
        {% if not product %}
          <div class="form-group" style="margin-bottom: 1.2rem;">
            <label class="form-label" style="display: block; font-weight: 600; margin-bottom: 6px;">Product ID (Unique Slug)</label>
            <input type="text" name="id" placeholder="e.g. paint-05 or resin-04" required class="form-control" style="width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
        {% endif %}

        <div class="form-group" style="margin-bottom: 1.2rem;">
          <label class="form-label" style="display: block; font-weight: 600; margin-bottom: 6px;">Artwork Title</label>
          <input type="text" name="title" value="{{ product['title'] if product else '' }}" placeholder="e.g. Whispering Tides" required class="form-control" style="width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; margin-bottom: 1.2rem;">
          <div class="form-group">
            <label class="form-label" style="display: block; font-weight: 600; margin-bottom: 6px;">Category</label>
            <select name="category" required class="form-control" style="width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
              {% for cat in ['Paintings', 'Resin Art', 'Wall Art', 'Handmade', 'Art Prints', 'Customized Gifts'] %}
                <option value="{{ cat }}" {% if product and product['category'] == cat %}selected{% endif %}>{{ cat }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" style="display: block; font-weight: 600; margin-bottom: 6px;">Badge (Optional)</label>
            <input type="text" name="badge" value="{{ product['badge'] if product and product['badge'] else '' }}" placeholder="e.g. Curator's Pick, Bestseller" class="form-control" style="width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; margin-bottom: 1.2rem;">
          <div class="form-group">
            <label class="form-label" style="display: block; font-weight: 600; margin-bottom: 6px;">Selling Price ($)</label>
            <input type="number" step="0.01" name="price" value="{{ product['price'] if product else '' }}" placeholder="195.00" required class="form-control" style="width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>

          <div class="form-group">
            <label class="form-label" style="display: block; font-weight: 600; margin-bottom: 6px;">Original Price ($ Optional)</label>
            <input type="number" step="0.01" name="original_price" value="{{ product['original_price'] if product and product['original_price'] else '' }}" placeholder="230.00" class="form-control" style="width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 1.2rem;">
          <label class="form-label" style="display: block; font-weight: 600; margin-bottom: 6px;">Image Asset URL or Path</label>
          <input type="text" name="image" value="{{ product['image'] if product else '/static/images/hero-art.jpg' }}" placeholder="/static/images/your-artwork.jpg" required class="form-control" style="width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; margin-bottom: 1.2rem;">
          <div class="form-group">
            <label class="form-label" style="display: block; font-weight: 600; margin-bottom: 6px;">Medium / Materials</label>
            <input type="text" name="medium" value="{{ product['medium'] if product else '' }}" placeholder="e.g. Oil & 24K Leaf on Linen" required class="form-control" style="width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>

          <div class="form-group">
            <label class="form-label" style="display: block; font-weight: 600; margin-bottom: 6px;">Dimensions</label>
            <input type="text" name="dimensions" value="{{ product['dimensions'] if product else '' }}" placeholder="e.g. 24 × 36 in (60 × 90 cm)" required class="form-control" style="width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 1.2rem;">
          <label class="form-label" style="display: block; font-weight: 600; margin-bottom: 6px;">Artwork Story / Description</label>
          <textarea name="description" rows="3" required class="form-control" style="width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">{{ product['description'] if product else '' }}</textarea>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="form-label" style="display: block; font-weight: 600; margin-bottom: 6px;">Details Bullet Points (One per line)</label>
          <textarea name="details" rows="3" class="form-control" placeholder="Original 1-of-1 studio creation&#10;Includes Certificate of Authenticity&#10;Ready to hang" style="width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm);">{% if product and product['details'] %}{{ product['details']|join('
') }}{% endif %}</textarea>
        </div>

        <div class="form-group" style="margin-bottom: 2rem;">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600;">
            <input type="checkbox" name="in_stock" value="1" {% if not product or product['in_stock'] %}checked{% endif %}>
            Mark as In Stock for Immediate Sale
          </label>
        </div>

        <div style="display: flex; gap: 1rem;">
          <button type="submit" class="btn btn-primary btn-lg" style="flex: 1;">
            <i class="fas fa-save" style="margin-right: 6px;"></i> {{ 'Save Artwork Changes' if product else 'Publish Artwork' }}
          </button>
          <a href="/admin/products" class="btn btn-secondary btn-lg">Cancel</a>
        </div>
      </form>
    </div>
  </main>

</body>
</html>
